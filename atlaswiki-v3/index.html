<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtlasWiki</title><meta name="atlas-api" content="">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>:root{--bg:#f8f9fa;--card:#fff;--text:#202122;--border:#a2a9b1}body[data-theme=dark]{--bg:#101418;--card:#1e252b;--text:#f1f3f5;--border:#495057}body[data-theme=sepia]{--bg:#f4ecd8;--card:#fff8e7;--text:#3b3024;--border:#c9b896}body{background:var(--bg);color:var(--text)}.navbar,.card,.modal-content,.form-control,.form-select{background:var(--card)!important;color:var(--text)!important;border-color:var(--border)!important}.wiki-title{font-family:Georgia,serif}.tag{border:1px solid var(--border);border-radius:1rem;padding:.1rem .55rem;margin:.1rem;font-size:.8rem}.comment{border-left:3px solid #0d6efd}.muted{opacity:.72}</style></head>
<body data-theme="light"><nav class="navbar navbar-expand-lg border-bottom sticky-top"><div class="container-fluid"><a class="navbar-brand wiki-title" href="#" onclick="home()">🌐 AtlasWiki</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">☰</button><div id="nav" class="collapse navbar-collapse"><form class="d-flex mx-lg-auto my-2 w-50" onsubmit="event.preventDefault();search()"><input id="q" class="form-control me-2" placeholder="Search or use lang:en tag:science team:explorers"><button class="btn btn-primary">Search</button></form><div class="d-flex gap-2"><select id="theme" class="form-select form-select-sm" onchange="setTheme(this.value)"><option>light</option><option>dark</option><option>sepia</option></select><button id="userBtn" class="btn btn-outline-primary btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#userModal">Set username</button><button class="btn btn-success btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#pageModal">Create page</button></div></div></div></nav>
<main class="container py-4"><div id="notice"></div><div id="content"></div></main>
<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" onsubmit="saveUsername(event)"><div class="modal-header"><h2 class="h5 modal-title">Choose a username</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label for="username" class="form-label">Username</label><input id="username" class="form-control" required minlength="2" maxlength="24" pattern="[A-Za-z0-9_.-]+"><div class="form-text">No password or login. This public name is saved in SQLite and attached to pages and comments.</div></div><div class="modal-footer"><button class="btn btn-primary">Save username</button></div></form></div></div>
<div class="modal fade" id="pageModal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" onsubmit="createPage(event)"><div class="modal-header"><h2 class="h5 modal-title">Create a user wiki page</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body row g-3"><div class="col-md-8"><label class="form-label">Title</label><input id="title" class="form-control" required></div><div class="col-md-4"><label class="form-label">Language</label><select id="lang" class="form-select"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option></select></div><div class="col-md-6"><label class="form-label">Team</label><input id="team" class="form-control" required></div><div class="col-md-6"><label class="form-label">Team moderation key</label><input id="teamKey" class="form-control" type="password" minlength="8" required><div class="form-text">Needed to create pages for this team and delete its comments.</div></div><div class="col-md-6"><label class="form-label">Tags</label><input id="tags" class="form-control" placeholder="science, space"></div><div class="col-12"><label class="form-label">Summary</label><input id="summary" class="form-control" required maxlength="240"></div><div class="col-12"><label class="form-label">Article</label><textarea id="body" class="form-control" rows="9" required></textarea></div></div><div class="modal-footer"><button class="btn btn-primary">Publish</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
<script>
const API=(document.querySelector('meta[name=atlas-api]').content||'').replace(/\/$/,'');let blockedWords=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let currentUser=localStorage.atlasUser||'';let pages=[];
function message(text,type='danger'){notice.innerHTML=`<div class="alert alert-${type}">${esc(text)}</div>`;setTimeout(()=>notice.innerHTML='',4000)}
async function api(url,opts={}){let r=await fetch(API+url,{headers:{'Content-Type':'application/json'},...opts});let data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function setTheme(v){document.body.dataset.theme=v;localStorage.atlasTheme=v}setTheme(localStorage.atlasTheme||'light');theme.value=localStorage.atlasTheme||'light';
function hasBlocked(text){let value=String(text||'').toLowerCase();return blockedWords.find(w=>new RegExp('(^|\\W)'+w.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'($|\\W)','i').test(value))}
function updateUser(){userBtn.textContent=currentUser?'@'+currentUser:'Set username';username.value=currentUser}updateUser();
async function saveUsername(e){e.preventDefault();try{let u=await api('/api/users',{method:'POST',body:JSON.stringify({username:username.value})});currentUser=u.username;localStorage.atlasUser=currentUser;updateUser();bootstrap.Modal.getInstance(userModal).hide();message('Username saved in the backend.','success')}catch(e){message(e.message)}}
function parse(raw){let filters={},text=[];(raw.match(/(?:[^\s"]+|"[^"]*")+/g)||[]).forEach(x=>{let m=x.match(/^(lang|tag|team):(.+)$/i);m?filters[m[1].toLowerCase()]=m[2].replaceAll('"',''):text.push(x.replaceAll('"',''))});return{filters,text:text.join(' ')}}
async function load(params=''){pages=await api('/api/pages'+params);renderList()}
function renderList(){content.innerHTML=`<h1 class="wiki-title border-bottom pb-2">Community pages</h1><p class="muted">${pages.length} page(s)</p>`+(pages.map(p=>`<article class="card p-3 mb-3"><div class="d-flex justify-content-between"><h2 class="h4"><a href="#" onclick="showPage(${p.id})">${esc(p.title)}</a></h2><span class="badge bg-secondary">${esc(p.language)}</span></div><p>${esc(p.summary)}</p><div>${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><small class="muted">Team ${esc(p.team)} · by ${esc(p.author||'AtlasWiki')} · ${esc(p.updated)}</small></article>`).join('')||'<div class="alert alert-info">No pages found.</div>')}
async function home(){q.value='';await load()}
async function search(){let {filters,text}=parse(q.value),p=new URLSearchParams();if(text)p.set('q',text);Object.entries(filters).forEach(([k,v])=>p.set(k,v));await load('?'+p)}
async function createPage(e){e.preventDefault();if(!currentUser){bootstrap.Modal.getInstance(pageModal).hide();new bootstrap.Modal(userModal).show();return message('Set a username before publishing.')}try{let p=await api('/api/pages',{method:'POST',body:JSON.stringify({username:currentUser,title:title.value,language:lang.value,team:team.value,tags:tags.value.split(','),summary:summary.value,body:body.value,team_key:teamKey.value})});e.target.reset();bootstrap.Modal.getInstance(pageModal).hide();showPage(p.id);message('Page published.','success')}catch(e){message(e.message)}}
async function showPage(id){let p=pages.find(x=>x.id===id)||(await api('/api/pages')).find(x=>x.id===id);if(!p)return;let comments=p.is_user_page?await api(`/api/pages/${id}/comments`):[];content.innerHTML=`<article class="card p-4"><h1 class="wiki-title border-bottom pb-2">${esc(p.title)}</h1><p class="muted">${esc(p.language)} · Team ${esc(p.team)} · by ${esc(p.author||'AtlasWiki')}</p><p class="lead">${esc(p.summary)}</p>${p.body.split(/\n\s*\n/).map(x=>`<p>${esc(x)}</p>`).join('')}</article>${p.is_user_page?`<section class="mt-4"><h2 class="h4">Comments</h2><form class="card p-3 mb-3" onsubmit="addComment(event,${id})"><label class="form-label" for="commentBody">Comment as ${esc(currentUser||'no username selected')}</label><textarea id="commentBody" class="form-control mb-2" maxlength="1000" required></textarea><button class="btn btn-primary align-self-start">Post comment</button></form><div>${comments.map(c=>`<article class="card comment p-3 mb-2"><div class="d-flex justify-content-between"><span><strong>@${esc(c.username)}</strong><small class="muted ms-2">${esc(new Date(c.created_at).toLocaleString())}</small></span><button class="btn btn-sm btn-outline-danger" onclick="deleteComment(${id},${c.id})">Team delete</button></div><p class="mb-0 mt-1">${esc(c.body)}</p></article>`).join('')||'<p class="muted">No comments yet.</p>'}</div></section>`:'<div class="alert alert-secondary mt-3">Comments are only enabled on user-made pages.</div>'}`}
async function deleteComment(pageId,commentId){let key=prompt('Enter the team moderation key:');if(!key)return;try{await api(`/api/pages/${pageId}/comments/${commentId}`,{method:'DELETE',body:JSON.stringify({team_key:key})});await showPage(pageId);message('Comment deleted by team.','success')}catch(e){message(e.message)}}
async function addComment(e,id){e.preventDefault();if(!currentUser){new bootstrap.Modal(userModal).show();return message('Set a username before commenting.')}try{await api(`/api/pages/${id}/comments`,{method:'POST',body:JSON.stringify({username:currentUser,body:commentBody.value})});await showPage(id);message('Comment posted.','success')}catch(e){message(e.message)}}
api('/api/config').then(c=>blockedWords=c.blocked_words||[]).catch(()=>{});
home().catch(e=>message('Backend unavailable. Run: python app.py'));
</script></body></html>
